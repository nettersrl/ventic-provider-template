  terms_url: https://contoso.example.invalid/OWNER_MUST_SUPPLY/terms
  privacy_url: https://contoso.example.invalid/OWNER_MUST_SUPPLY/privacy
domains:
  marketing: contoso.example.invalid
  portal: portal.contoso.example.invalid
  api: api.contoso.example.invalid
  docs: docs.contoso.example.invalid
  chat: chat.contoso.example.invalid
  notifications: notifications.contoso.example.invalid
secrets:
