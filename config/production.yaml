# Public template values. Supply real domains and owner-approved legal URLs.
installation: contoso
profile: bundled
localBuild: false
localDevelopment:
  enabled: false
provider:
  name: Contoso
  company: Contoso Ltd
  support_email: support@contoso.example.invalid
  logo_url: /brand/contoso.svg
  logo_light_url: /brand/contoso.svg
  logo_dark_url: /brand/contoso-dark.svg
  primary_color: '#2563eb'
  portal_url: https://portal.contoso.example.invalid
  api_url: https://api.contoso.example.invalid
  marketing_url: https://contoso.example.invalid
  docs_url: https://docs.contoso.example.invalid
  chat_host: chat.contoso.example.invalid
