stages: [verify, deploy]
variables:
  VENTIC_BACKEND_DIR: "$CI_PROJECT_DIR/.build/sources/backend"
  VENTIC_FRONTEND_DIR: "$CI_PROJECT_DIR/.build/sources/frontend"
  GIT_ASKPASS: "$CI_PROJECT_DIR/.build/git-askpass.py"
  GIT_TERMINAL_PROMPT: "0"
  BUILD_JOBS: "2"
  CARGO_BUILD_JOBS: "2"
# Dedicated Linux shell runners provide Python 3.12+, Rust from the locked
# toolchain, Node 26, Docker, Helm and kubectl. Private inputs are never artifacts.
default:
  tags: [ventic-provider]
  before_script:
    - python3 scripts/ci-bootstrap.py
    - python3 scripts/sources.py fetch
verify:
  stage: verify
  script:
    - python3 scripts/ci.py verify
.deploy:
  stage: deploy
  needs: [verify]
  tags: [ventic-provider-deploy]
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never
  allow_failure: false
  script:
    - python3 scripts/ci.py deploy --environment "$DEPLOY_ENVIRONMENT"
deploy-staging:
  extends: .deploy
  environment:
    name: staging
    deployment_tier: staging
  resource_group: provider-staging
  variables:
    DEPLOY_ENVIRONMENT: staging
deploy-production:
  extends: .deploy
  environment:
    name: production
    deployment_tier: production
  resource_group: provider-production
  variables:
    DEPLOY_ENVIRONMENT: production
