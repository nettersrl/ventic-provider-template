name: Verify provider template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install installer dependencies
        run: python -m pip install -r requirements-installer.txt
      - name: Verify offline template and signed-release handling
        run: python -m unittest discover -s tests -v
      - name: Validate deployment plans without cluster access
        run: |
          make deploy-plan ENVIRONMENT=staging
          make deploy-plan ENVIRONMENT=production
